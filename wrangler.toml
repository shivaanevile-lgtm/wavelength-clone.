name = "wavelength-clone"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# Create this KV namespace with:
#   npx wrangler kv namespace create ROOMS
# then paste the id it prints below (and repeat with --preview for preview_id).
[[kv_namespaces]]
binding = "ROOMS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_PREVIEW_KV_NAMESPACE_ID"
